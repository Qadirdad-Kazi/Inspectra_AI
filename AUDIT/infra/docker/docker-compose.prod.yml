# Production-oriented stack: app services + deps. Scale API with --scale api=N
# Usage:
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 4000
      TRUST_PROXY: "1"
      WEB_URL: ${WEB_URL:-https://app.example.com}
      DATABASE_URL: postgresql://inspectra:${POSTGRES_PASSWORD:-inspectra}@postgres:5432/inspectra?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspectra}

  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
