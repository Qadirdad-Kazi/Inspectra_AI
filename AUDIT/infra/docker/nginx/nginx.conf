worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Basic hardening
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Gzip for text payloads
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;

  upstream api_upstream {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when certs are mounted (optional)
    # return 301 https://$host$request_uri;

    location /health {
      proxy_pass http://api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /health/ready {
      proxy_pass http://api_upstream/health/ready;
      proxy_http_version 1.1;
    }

    location /metrics {
      # Prefer scraping from in-cluster network; restrict in real prod
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_upstream/metrics;
    }

    location /v1/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
      client_max_body_size 10m;
    }

    location / {
      limit_req zone=web_limit burst=80 nodelay;
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
