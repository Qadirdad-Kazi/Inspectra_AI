name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to deploy (defaults to git SHA)
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/inspectra-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/inspectra-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/inspectra-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/inspectra-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    needs: build-and-push
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Record previous revision (rollback marker)
        id: prev
        run: |
          echo "Record current image digests / kubectl rollout history before apply."
          echo "prev_tag=${{ needs.build-and-push.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Apply manifests (placeholder)
        run: |
          set -euo pipefail
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          OWNER="${{ github.repository_owner }}"
          echo "Would deploy:"
          echo "  ghcr.io/${OWNER}/inspectra-api:${TAG}"
          echo "  ghcr.io/${OWNER}/inspectra-web:${TAG}"
          echo "Wire kubectl/helm here:"
          echo "  kubectl set image deploy/api api=ghcr.io/${OWNER}/inspectra-api:${TAG} -n inspectra"
          echo "  kubectl set image deploy/web web=ghcr.io/${OWNER}/inspectra-web:${TAG} -n inspectra"
          echo "  kubectl rollout status deploy/api -n inspectra --timeout=5m"
          echo "  kubectl rollout status deploy/web -n inspectra --timeout=5m"
          # Uncomment when cluster credentials are available:
          # kubectl apply -f infra/k8s/namespace.yaml
          # sed "s|ghcr.io/ORG/inspectra-api:PLACEHOLDER|ghcr.io/${OWNER}/inspectra-api:${TAG}|g" infra/k8s/api.yaml | kubectl apply -f -
          # sed "s|ghcr.io/ORG/inspectra-web:PLACEHOLDER|ghcr.io/${OWNER}/inspectra-web:${TAG}|g" infra/k8s/web.yaml | kubectl apply -f -
          # pnpm --filter @inspectra/db migrate:deploy

      - name: Smoke health
        run: |
          echo "curl -fsS https://staging-api.example.com/health/ready"
          # curl -fsS "${{ vars.STAGING_API_URL }}/health/ready"

  deploy-production:
    name: Deploy production
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with rollback plan
        run: |
          set -euo pipefail
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          OWNER="${{ github.repository_owner }}"
          echo "Production deploy of tag ${TAG}"
          echo "Rollback: kubectl rollout undo deploy/api -n inspectra && kubectl rollout undo deploy/web -n inspectra"
          echo "See docs/runbooks/production-deploy.md"
