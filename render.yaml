# Render Blueprint — Inspectra API + Postgres
# https://render.com/docs/blueprint-spec
#
# Migrations run during build (build:api:render → prisma migrate deploy).
# If the DB was created before that, trigger a Manual Deploy once so migrate runs.

databases:
  - name: inspectra-db
    plan: free

services:
  - type: web
    name: inspectra-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install -g pnpm@9.15.4 && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @inspectra/db generate && pnpm --filter @inspectra/db migrate:deploy && pnpm --filter @inspectra/api... build
    startCommand: API_PORT=$PORT node apps/api/dist/main.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AI_DEFAULT_PROVIDER
        value: auto
      # Secrets on this API service (Render dashboard):
      #   OPENROUTER_API_KEY (preferred) and/or GEMINI_API_KEY / OPENAI_API_KEY
      # Optional: AI_PROVIDER=openrouter|gemini|openai — must NOT be stub/none
      # Verify after deploy: GET /health → llm.available === true
      - key: ENABLE_SWAGGER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: inspectra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_URL
        value: https://inspectra-tan.vercel.app
